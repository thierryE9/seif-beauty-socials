<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seif Beauty Clinic</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --primary:#B41B88;
    --primary-dark:#94156f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(
        180deg,
        #ffffff 0%,
        #fcf7fb 50%,
        #faf4f9 100%
    );

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;

    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(10px);

    padding:36px;
    border-radius:24px;

    border:1px solid rgba(180,27,136,0.08);

    box-shadow:
        0 8px 30px rgba(180,27,136,0.08);
}

.logo{
    width:180px;
    height:180px;
    object-fit:contain;
    margin-bottom:20px;
}

.subtitle{
    color:#666;
    margin-bottom:32px;
    font-size:16px;
    line-height:1.5;
}

.link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    width:100%;
    padding:16px;
    margin-bottom:16px;

    background:linear-gradient(
        135deg,
        #d95db5 0%,
        #b41b88 100%
    );

    color:white;
    text-decoration:none;

    border-radius:14px;
    font-size:18px;
    font-weight:600;

    box-shadow:
        0 4px 15px rgba(180,27,136,0.20);

    transition:all .25s ease;
}

.link-btn:hover{
    background:linear-gradient(
        135deg,
        #e16dc0 0%,
        #c02092 100%
    );

    transform:translateY(-3px);

    box-shadow:
        0 8px 20px rgba(180,27,136,0.30);
}

.link-btn i{
    font-size:22px;
}

.footer{
    margin-top:20px;
    color:#888;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    
    <h1>Seif Beauty Clinic</h1>

    <p class="subtitle">
        Find us on social media
    </p>

    <a class="link-btn"
       href="https://www.instagram.com/seifbeautyclinic.lb/?hl=en"
       target="_blank"
       rel="noopener noreferrer">
        <i class="fa-brands fa-instagram"></i>
        Instagram
    </a>

    <a class="link-btn"
       href="https://www.facebook.com/Seifbeautyclinic/"
       target="_blank"
       rel="noopener noreferrer">
        <i class="fa-brands fa-facebook-f"></i>
        Facebook
    </a>

    <div class="footer">
        © Seif Beauty Clinic
    </div>

</div>

</body>
</html>
