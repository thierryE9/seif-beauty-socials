<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seif Beauty Clinic</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --primary:#B41B88;
    --primary-dark:#94156f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
}

.logo{
    width:180px;
    height:180px;
    object-fit:contain;
    border-radius:20px;
    margin-bottom:24px;
}

h1{
    color:var(--primary);
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:32px;
}

.link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    width:100%;
    padding:16px;
    margin-bottom:16px;

    background:var(--primary);
    color:white;
    text-decoration:none;

    border-radius:14px;
    font-size:18px;
    font-weight:600;

    transition:.2s;
}

.link-btn:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
}

.link-btn i{
    font-size:22px;
}

.footer{
    margin-top:24px;
    color:#888;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Seif Beauty Clinic Logo" class="logo">

    <h1>Seif Beauty Clinic</h1>

    <p class="subtitle">
        Follow us on social media
    </p>

    <a class="link-btn"
       href="https://www.instagram.com/seifbeautyclinic.lb/?hl=en"
       target="_blank">
        <i class="fa-brands fa-instagram"></i>
        Instagram
    </a>

    <a class="link-btn"
       href="https://www.facebook.com/Seifbeautyclinic/"
       target="_blank">
        <i class="fa-brands fa-facebook-f"></i>
        Facebook
    </a>

    <div class="footer">
        © Seif Beauty Clinic
    </div>

</div>

</body>
</html>
